# Nginx config cho frontend (Trợ Lý Pháp Luật)
#
# Vai trò:
# 1. Serve static files (index.html, style.css, script.js, config.js)
# 2. Reverse-proxy các path của backend về đúng microservice:
#      /auth/*    → auth-service:8001
#      /chats/*   → chat-service:8002
#      /api/*     → rag-service:8003  (cho cả RAG public và CORS-friendly)
# 3. Health endpoint cho Docker healthcheck
#
# Lưu ý:
# - Tên service (auth-service, chat-service, rag-service) là docker-compose
#   service names, chỉ resolve được trong Docker network.
# - Khi chạy local không Docker, frontend mở cổng 5500 và gọi
#   trực tiếp vào http://localhost:8001/8002/8003 (xem script.js).

# Upstream chỉ resolve được khi service tương ứng đang chạy
# trong Docker network.
upstream auth_service  { server auth-service:8001; }
upstream chat_service  { server chat-service:8002; }
# upstream rag_service   { server rag-service:8003; }   # tạm tắt

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # Health
    # ----------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ----------------------------------------------------------
    # Reverse-proxy: auth-service
    # /auth/google/login  → redirect user sang Google OAuth
    # /auth/google/callback → Google redirect về đây
    # /auth/me            → lấy thông tin user hiện tại
    # ----------------------------------------------------------
    location /auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        # Google OAuth cần buffer response body đủ lớn cho redirect
        proxy_buffering off;
    }

    # ----------------------------------------------------------
    # Reverse-proxy: chat-service
    # /chats/, /chats/{id}, /chats/{id}/messages
    # ----------------------------------------------------------
    location /chats/ {
        proxy_pass http://chat_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;   # gọi RAG có thể chậm
    }

    # ----------------------------------------------------------
    # Reverse-proxy: rag-service (TẠM TẮT — rag-service chưa build)
    # /api/chat (RAG public, không cần auth)
    # Khi bật lại rag-service thì bỏ comment block dưới và bật
    # upstream rag_service ở trên.
    # ----------------------------------------------------------
    location /api/ {
        default_type application/json;
        return 503 '{"detail":"RAG service tạm thời không khả dụng. Vui lòng bật rag-service trong docker-compose.yml và frontend/nginx.conf."}';
    }
    # location /api/ {
    #     proxy_pass http://rag_service;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_redirect off;
    #     proxy_read_timeout 120s;
    # }

    # ----------------------------------------------------------
    # Static assets — cache 7 ngày
    # ----------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ----------------------------------------------------------
    # Default — SPA fallback, không cache HTML
    # ----------------------------------------------------------
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
