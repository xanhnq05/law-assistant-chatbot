<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trợ Lý Pháp Luật</title>
  <meta name="description" content="Tra cứu & giải đáp pháp lý Việt Nam bằng AI" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="./config.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <div id="app"></div>

  <!-- Template cho trang login -->
  <template id="login-template">
    <div class="login-screen">
      <div class="login-card">
        <div class="login-brand">
          <div class="icon-ring">
            <i data-lucide="scale" width="28" height="28"></i>
          </div>
          <h1>Trợ Lý Pháp Luật</h1>
          <p>Tra cứu &amp; giải đáp pháp lý Việt Nam bằng AI</p>
        </div>

        <button class="google-btn" id="googleLoginBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z" />
            <path fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.6 15.7 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z" />
            <path fill="#4CAF50"
              d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.2 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z" />
            <path fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.4C41.1 36 44 30.6 44 24c0-1.3-.1-2.4-.4-3.5z" />
          </svg>
          <span>Đăng nhập bằng Gmail</span>
        </button>

        <p class="login-hint">
          Hệ thống sẽ chuyển hướng sang Google để xác thực an toàn.
          Sau khi đăng nhập bạn sẽ được đưa về trang này.
        </p>

        <div class="login-disclaimer">
          <i data-lucide="shield-alert" width="14" height="14"></i>
          <span>
            Nội dung do AI cung cấp chỉ mang tính tham khảo, không thay thế ý kiến
            tư vấn chính thức của luật sư hoặc cơ quan nhà nước có thẩm quyền.
          </span>
        </div>
      </div>
    </div>
  </template>

  <!-- Template cho shell app chính -->
  <template id="app-shell-template">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="icon-ring-sm"><i data-lucide="scale" width="16" height="16"></i></div>
          <span class="brand-name">Trợ Lý Pháp Luật</span>
          <button class="icon-btn close-btn" id="closeSidebarBtn" title="Đóng">
            <i data-lucide="x" width="18" height="18"></i>
          </button>
        </div>
        <div class="new-chat-wrap">
          <button class="new-chat-btn" id="newChatBtn" type="button">
            <i data-lucide="plus" width="16" height="16"></i>
            <span>Hồ sơ mới</span>
          </button>
        </div>
        <div class="chat-list" id="chatList">
          <div class="chat-list-label">Hồ sơ tư vấn</div>
          <div id="chatListItems"></div>
        </div>
        <div class="sidebar-user">
          <button class="user-row" id="userMenuBtn" type="button">
            <span id="userAvatarSlot"></span>
            <div class="user-meta">
              <div class="name" id="userName">—</div>
              <div class="email" id="userEmail">—</div>
            </div>
            <i data-lucide="chevron-down" width="15" height="15"></i>
          </button>
          <div class="user-menu" id="userMenu" hidden>
            <button class="logout-btn" id="logoutBtn" type="button">
              <i data-lucide="log-out" width="15" height="15"></i>
              <span>Đăng xuất</span>
            </button>
          </div>
        </div>
      </aside>
      <div class="main-panel">
        <div class="topbar">
          <button class="icon-btn menu-toggle" id="toggleSidebarBtn" title="Mở menu">
            <i data-lucide="menu" width="20" height="20"></i>
          </button>
          <div class="topbar-text">
            <div class="topbar-title" id="topbarTitle">Cuộc trò chuyện mới</div>
            <div class="topbar-code" id="topbarCode"></div>
          </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="composer">
          <div class="composer-inner">
            <div class="composer-box">
              <textarea id="messageInput" rows="1" placeholder="Đặt câu hỏi pháp lý của bạn…"></textarea>
              <button class="send-btn" id="sendBtn" type="button" disabled>
                <i data-lucide="send" width="14" height="14"></i>
              </button>
            </div>
            <p class="composer-disclaimer">
              Thông tin do AI cung cấp chỉ mang tính tham khảo, không thay thế tư vấn pháp lý chính thức.
            </p>
          </div>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
