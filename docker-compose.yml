# ============================================================
# Docker Compose — Trợ Lý Pháp Luật (all-in-one)
#
# Chạy: docker compose up --build
# Dừng: docker compose down
# Log:  docker compose logs -f chat-service
#
# Bao gồm:
#   - auth-service   (port nội bộ 8001)
#   - chat-service   (port nội bộ 8002)
#   - rag-service    (port nội bộ 8003)
#   - frontend       (port nội bộ 80  — serve static React)
#   - nginx-gateway  (port public 8080 — proxy tất cả)
#
# Tất cả biến môi trường backend load từ backend/.env (duy nhất).
# Truy cập web ở: http://localhost:8080
# ============================================================

services:
  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    image: tro-ly-luat/auth-service:latest
    container_name: tlpl-auth
    restart: unless-stopped
    # Expose ra host để debug (VD: xem log trực tiếp).
    # Nginx gateway vẫn gọi nội bộ qua tên service.
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      AUTH_SERVICE_PORT: "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tlpl-net

  chat-service:
    build:
      context: ./backend/services/chat-service
      dockerfile: Dockerfile
    image: tro-ly-luat/chat-service:latest
    container_name: tlpl-chat
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    environment:
      CHAT_SERVICE_PORT: "8002"
    depends_on:
      - auth-service
      - rag-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tlpl-net

  rag-service:
    build:
      context: ./backend/services/rag-service
      dockerfile: Dockerfile
    image: tro-ly-luat/rag-service:latest
    container_name: tlpl-rag
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tlpl-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Nhúng vào bundle Vite. Browser gọi nginx-gateway qua localhost:8080.
        VITE_API_URL: "http://localhost:8080"
    image: tro-ly-luat/frontend:latest
    container_name: tlpl-frontend
    restart: unless-stopped
    # Frontend được nginx-gateway proxy, không cần expose port.
    # Uncomment dòng dưới nếu muốn debug trực tiếp React static:
    # ports:
    #   - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - auth-service
      - chat-service
      - rag-service
    networks:
      - tlpl-net

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: tlpl-nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # <-- cổng duy nhất người dùng truy cập
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - chat-service
      - rag-service
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - tlpl-net

networks:
  tlpl-net:
    driver: bridge
    name: tlpl-net