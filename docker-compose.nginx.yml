# ============================================================
# Docker compose chỉ chạy nginx gateway (cổng 8080).
# Dùng khi bạn muốn chạy auth/chat/rag + Vite trên terminal
# mà vẫn có gateway duy nhất cổng 8080 (giống production).
#
# Chạy:  docker compose -f docker-compose.nginx.yml up -d
# Dừng:  docker compose -f docker-compose.nginx.yml down
# Log:   docker compose -f docker-compose.nginx.yml logs -f
#
# LƯU Ý: trước khi chạy, vào infra/nginx/nginx.conf đã comment
# các dòng "host.docker.internal:..." và uncomment các dòng
# tên service (auth-service:8001,...). Hoặc ngược lại tuỳ bạn.
# Ở file này mặc định đang cấu hình cho chạy từng service trên host.
# ============================================================
services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: tlpl-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Cần thiết: container Docker truy cập host Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tlpl-net-nginx

networks:
  tlpl-net-nginx:
    driver: bridge
    name: tlpl-net-nginx