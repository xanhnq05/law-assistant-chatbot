# ============================================================
# Nginx config — gateway duy nhất ở cổng 8080.
# Proxy sang:
#   - auth-service   : /auth/*  →  host:8001  (hoặc auth-service:8001 trong Docker)
#   - chat-service   : /chats/* →  host:8002  (hoặc chat-service:8002 trong Docker)
#   - rag-service    : /rag/*   →  host:8003  (hoặc rag-service:8003  trong Docker)
#   - frontend (Vite): /*       →  host:5173  (hoặc frontend:80     trong Docker)
#
# Hai chế độ chạy:
#   A) Docker compose all-in-one:
#        mỗi upstream là tên service trong Docker network (auth-service:8001,...)
#   B) Chạy từng service trên terminal (host Windows):
#        dùng host.docker.internal để container nginx truy cập vào host.
#        → Đã cấu hình cả 2 trong block upstream bên dưới; comment/uncomment
#          tuỳ theo cách bạn đang chạy.
# ============================================================

# ----- Auth-service: comment 1 trong 2 dòng tuỳ chế độ chạy -----
# (Docker all-in-one)
upstream auth_service  { server auth-service:8001; }
# (Terminal từng service trên host)
# upstream auth_service  { server host.docker.internal:8001; }

# ----- Chat-service -----
upstream chat_service  { server chat-service:8002; }
# upstream chat_service  { server host.docker.internal:8002; }

# ----- RAG-service -----
upstream rag_service   { server rag-service:8003; }
# upstream rag_service   { server host.docker.internal:8003; }

# ----- Frontend (Vite dev server) -----
upstream web_frontend  { server frontend:80; }
# upstream web_frontend  { server host.docker.internal:5173; }

server {
    listen 80;
    server_name localhost;

    # ---------- Health ----------
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---------- Auth-service ----------
    location /auth/ {
        proxy_pass         http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ---------- Chat-service ----------
    location /chats/ {
        proxy_pass         http://chat_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- RAG-service ----------
    location /rag/ {
        proxy_pass         http://rag_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- Frontend ----------
    location / {
        proxy_pass         http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}